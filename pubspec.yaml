name: jdonuts
description: Offline-first J'Donuts technical assessment.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.4
  connectivity_plus: ^7.2.0
  path_provider: ^2.1.6
  intl: any
  drift: ^2.33.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/seed.json
    - assets/images/
